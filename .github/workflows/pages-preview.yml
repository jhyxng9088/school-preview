name: Deploy S-Hub Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-preview-pages
  cancel-in-progress: true

env:
  PREVIEW_LAYER_ID: live-home-stage3-v3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preview control files
        uses: actions/checkout@v4
        with:
          path: preview-control

      - name: Checkout exact current school main
        run: |
          set -euo pipefail
          git clone --depth=2 --branch main https://github.com/jhyxng9088/school.git production-source
          echo "MAIN_BASELINE_SHA=$(git -C production-source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: production-source/package-lock.json

      - name: Test untouched production source
        working-directory: production-source
        run: |
          npm ci
          npm test

      - name: Guard Stage 1 foundation ownership
        run: |
          set -euo pipefail
          for file in \
            stage1-experience-state.js \
            stage1-experience-state-react.jsx \
            stage1-experience-state-study-bridge.js \
            stage1-experience-state-source-patch.js \
            stage1-experience-state.test.js \
            stage1-patch.py; do
            test -f "preview-control/preview/$file"
          done
          grep -Fq 'experience-state-stage1-v1' preview-control/preview/stage1-experience-state.js
          ! grep -ERq '\bfetch[[:space:]]*\(' \
            preview-control/preview/stage1-experience-state.js \
            preview-control/preview/stage1-experience-state-react.jsx \
            preview-control/preview/stage1-experience-state-study-bridge.js
          ! grep -ERq 'MutationObserver|createPortal|UnifiedBottomSheet' \
            preview-control/preview/stage1-experience-state.js \
            preview-control/preview/stage1-experience-state-react.jsx \
            preview-control/preview/stage1-experience-state-study-bridge.js

      - name: Apply Preview-only Stage 1 foundation
        run: |
          set -euo pipefail
          python3 preview-control/preview/stage1-patch.py production-source "$MAIN_BASELINE_SHA" overlay
          grep -Fq 'experience-state-stage1-v1' production-source/src/experience-state.js
          grep -Fq 'next = patchExperienceStateSource(next, cleanId)' production-source/vite.config.js
          grep -Fq "base: '/school/'" production-source/vite.config.js

      - name: Test Stage 1 Experience State model
        working-directory: production-source
        run: node --test tests/experience-state-stage1.test.js

      - name: Guard Stage 2 live surface ownership
        run: |
          set -euo pipefail
          for file in \
            stage2-experience-surface-model.js \
            stage2-experience-surface.jsx \
            stage2-experience-surface.css \
            stage2-experience-surface-source-patch.js \
            stage2-experience-surface.test.js \
            stage2-patch.py; do
            test -f "preview-control/preview/$file"
          done
          grep -Fq 'experience-surface-stage2-v1' preview-control/preview/stage2-experience-surface-model.js
          grep -Fq 'useExperienceState' preview-control/preview/stage2-experience-surface.jsx
          grep -Fq '<ExperienceSurface />' preview-control/preview/stage2-experience-surface-source-patch.js
          ! grep -ERq '\bfetch[[:space:]]*\(|MutationObserver|createPortal|setInterval|addEventListener' \
            preview-control/preview/stage2-experience-surface-model.js \
            preview-control/preview/stage2-experience-surface.jsx \
            preview-control/preview/stage2-experience-surface-source-patch.js
          ! grep -Fq '@keyframes' preview-control/preview/stage2-experience-surface.css

      - name: Guard Stage 3 adaptive home ownership
        run: |
          set -euo pipefail
          for file in \
            stage3-home-flow-model.js \
            stage3-home-flow.jsx \
            stage3-home-flow.css \
            stage3-home-source-patch.js \
            stage3-home-flow.test.js \
            stage3-patch.py; do
            test -f "preview-control/preview/$file"
          done
          grep -Fq 'live-home-stage3-v3' preview-control/preview/stage3-home-flow-model.js
          grep -Fq 'buildStage3LayoutModel' preview-control/preview/stage3-home-flow-model.js
          grep -Fq 'Stage3HomeFrame' preview-control/preview/stage3-home-flow.jsx
          grep -Fq 'data-stage3-mode' preview-control/preview/stage3-home-flow.jsx
          grep -Fq 'Stage3HomeFrame homeStackRef' preview-control/preview/stage3-home-source-patch.js
          ! grep -ERq '\bfetch[[:space:]]*\(|MutationObserver|createPortal|setInterval|addEventListener' \
            preview-control/preview/stage3-home-flow-model.js \
            preview-control/preview/stage3-home-flow.jsx \
            preview-control/preview/stage3-home-source-patch.js
          ! grep -Fq '@keyframes' preview-control/preview/stage3-home-flow.css

      - name: Apply Preview-only Stage 2 and Stage 3 adaptive home
        run: |
          set -euo pipefail
          python3 preview-control/preview/stage2-patch.py production-source "$MAIN_BASELINE_SHA" overlay
          grep -Fq 'experience-surface-stage2-v1' production-source/src/experience-surface-model.js
          grep -Fq 'live-home-stage3-v3' production-source/src/stage3-home-flow-model.js
          grep -Fq 'Stage3HomeFrame' production-source/src/stage3-home-flow.jsx
          grep -Fq 'next = patchExperienceSurfaceSource(next, cleanId)' production-source/vite.config.js
          grep -Fq 'next = patchStage3HomeSource(next, cleanId)' production-source/vite.config.js
          grep -Fq "base: '/school/'" production-source/vite.config.js

      - name: Test Stage 2 Experience Surface model
        working-directory: production-source
        run: node --test tests/experience-surface-stage2.test.js

      - name: Test Stage 3 Adaptive Home model
        working-directory: production-source
        run: node --test tests/stage3-home-flow.test.js

      - name: Test Stage 3 overlay against production regression suite
        working-directory: production-source
        run: npm test

      - name: Apply Preview runtime isolation
        run: |
          set -euo pipefail
          python3 preview-control/preview/stage1-patch.py production-source "$MAIN_BASELINE_SHA" isolate
          python3 preview-control/preview/stage2-patch.py production-source "$MAIN_BASELINE_SHA" isolate
          grep -Fq "base: '/school-preview/'" production-source/vite.config.js
          grep -Fq 'experience-state-stage1-v1' production-source/index.html
          grep -Fq 'experience-surface-stage2-v1' production-source/index.html
          grep -Fq 'live-home-stage3-v3' production-source/index.html
          grep -Fq 'school-sync-preview' production-source/src/school-sync.js
          grep -Fq 'preview-class-' production-source/src/school-sync.js
          grep -Fq 'preview|' production-source/src/school-sync.js
          grep -Fq 'school-preview-shell-experience-stage2-v1' production-source/public/sw.js
          grep -Fq 'school-preview-notification-profile-experience-stage2-v1' production-source/public/sw.js
          grep -Fq 'live-home-stage3-v3' production-source/public/sw.js
          grep -Fq "key.startsWith('school-preview-')" production-source/public/sw.js
          test -s production-source/public/stage3-smoke.json

      - name: Test Preview isolation contract
        working-directory: production-source
        run: node --test push-backend-v2/test/preview-isolation.test.js

      - name: Build Preview
        working-directory: production-source
        run: npm run build

      - name: Generate hosted live-home fixture
        working-directory: production-source
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          import { resolveExperienceState } from './src/experience-state.js'
          import { buildExperienceSurfaceModel } from './src/experience-surface-model.js'
          import { buildStage3ContextModel, buildStage3LayoutModel } from './src/stage3-home-flow-model.js'

          const at = (value) => new Date(value)
          const school = (kind, extra = {}) => ({ kind, configured: true, current: null, next: null, last: null, ...extra })
          const resolved = (input) => resolveExperienceState(input)
          const surface = (input) => buildExperienceSurfaceModel(resolved(input))
          const context = (input) => buildStage3ContextModel({ state: resolved(input), todos: input.todos || [] })
          const layout = (input) => buildStage3LayoutModel(resolved(input))
          const current = { number: 1, subject: '정보', start: '09:10', end: '10:00' }
          const next = { number: 2, subject: '수학', start: '10:10', end: '11:00' }
          const classInput = {
            now: at('2026-09-07T09:30:00+09:00'),
            schoolState: school('class', { current, next }),
            todos: [{ title: '영어 단어', dueDate: '2026-09-08', dueTime: '09:00' }],
          }
          const urgentInput = {
            now: at('2026-09-07T16:00:00+09:00'),
            schoolState: school('done', { last: current }),
            todos: [{ title: '수학 수행평가', dueDate: '2026-09-07', dueTime: '16:30' }],
          }
          const fixture = {
            classState: surface(classInput),
            classContext: context(classInput),
            classLayout: layout(classInput),
            holiday: surface({
              now: at('2026-09-07T10:00:00+09:00'),
              schoolState: school('class', { current }),
              academicEvents: [{ rawDate: '20260907', name: '대체공휴일', dayOffType: '공휴일' }],
            }),
            discretionary: surface({
              now: at('2026-09-07T10:00:00+09:00'),
              schoolState: school('class', { current }),
              academicEvents: [{ rawDate: '20260907', name: '학교장 재량휴업일', dayOffType: '휴업일' }],
            }),
            study: surface({
              now: at('2026-09-07T09:30:00+09:00'),
              schoolState: school('class', { current, next }),
              studyActive: { subject: '영단어', startedAt: 1 },
            }),
            urgent: surface(urgentInput),
            urgentLayout: layout(urgentInput),
            weekendLayout: buildStage3LayoutModel({
              primary: 'normal',
              context: { school: { kind: 'weekend' } },
            }),
            setupLayout: buildStage3LayoutModel({
              primary: 'normal',
              context: { school: { kind: 'no-timetable' } },
            }),
            offlineClass: surface({
              now: at('2026-09-07T09:30:00+09:00'),
              schoolState: school('class', { current, next }),
              online: false,
            }),
          }
          writeFileSync('dist/stage2-smoke.json', JSON.stringify(fixture, null, 2))
          NODE

      - name: Verify isolated Stage 3 artifact
        working-directory: production-source
        run: |
          set -euo pipefail
          grep -Fq 's-hub-preview-baseline' dist/index.html
          grep -Fq 'experience-state-stage1-v1' dist/index.html
          grep -Fq 'experience-surface-stage2-v1' dist/index.html
          grep -Fq 'live-home-stage3-v3' dist/index.html
          grep -Fq 'school-preview-shell-experience-stage2-v1' dist/sw.js
          grep -Fq 'school-preview-notification-profile-experience-stage2-v1' dist/sw.js
          grep -Fq 'live-home-stage3-v3' dist/sw.js
          grep -Fq "key.startsWith('school-preview-')" dist/sw.js
          test -s dist/stage2-smoke.json
          test -s dist/stage3-smoke.json
          grep -Fq '학교장 재량휴업일' dist/stage2-smoke.json
          grep -Fq '영단어' dist/stage2-smoke.json
          grep -Fq '수학 수행평가' dist/stage2-smoke.json
          grep -Fq 'live-home-stage3-v3' dist/stage3-smoke.json
          grep -Fq 'adaptive-layout' dist/stage3-smoke.json
          grep -Fq '"rest"' dist/stage3-smoke.json
          bundle="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' | head -n1)"
          test -n "$bundle"
          grep -Fq 'experience-state-stage1-v1' "$bundle"
          grep -Fq 'experience-surface-stage2-v1' "$bundle"
          grep -Fq 'live-home-stage3-v3' "$bundle"
          grep -Fq 'data-stage3-live-home' "$bundle"
          grep -Fq 'data-stage3-mode' "$bundle"
          grep -Fq 'data-experience-primary' "$bundle"
          grep -Fq 'school-sync-preview' "$bundle"
          grep -Fq 'preview-class-' "$bundle"
          grep -Fq 'preview|' "$bundle"
          ! grep -Eq 'ia2-home-canvas|ia2-class-hub|ia2-schedule-hub|ia2-ai-workspace' "$bundle"
          node scripts/verify-preview-isolation.mjs dist

      - name: Verify school main did not advance during build
        working-directory: production-source
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${MAIN_BASELINE_SHA}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: production-source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed Stage 3 Preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            h="$(curl -fsSL "${PAGE_URL}?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            s="$(curl -fsSL "${PAGE_URL}sw.js?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            f="$(curl -fsSL "${PAGE_URL}stage2-smoke.json?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            g="$(curl -fsSL "${PAGE_URL}stage3-smoke.json?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            if grep -Fq 'live-home-stage3-v3' <<< "$h" \
              && grep -Fq 'school-preview-shell-experience-stage2-v1' <<< "$s" \
              && grep -Fq 'live-home-stage3-v3' <<< "$s" \
              && grep -Fq "key.startsWith('school-preview-')" <<< "$s" \
              && grep -Fq '학교장 재량휴업일' <<< "$f" \
              && grep -Fq '영단어' <<< "$f" \
              && grep -Fq '수학 수행평가' <<< "$f" \
              && grep -Fq 'live-home-stage3-v3' <<< "$g" \
              && grep -Fq 'adaptive-layout' <<< "$g"; then
              printf '%s' "$f" > /tmp/stage2-smoke.json
              printf '%s' "$g" > /tmp/stage3-smoke.json
              node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('/tmp/stage2-smoke.json','utf8'));const y=JSON.parse(fs.readFileSync('/tmp/stage3-smoke.json','utf8'));const a=(c,m)=>{if(!c)throw new Error(m)};a(x.classState.version==='experience-surface-stage2-v1','class version');a(x.classState.primary==='class-active','class primary');a(x.classState.title==='정보','class title');a(x.classContext.version==='live-home-stage3-v3','context version');a(x.classContext.mode==='school','context mode');a(x.classContext.segments[0].value==='정보','context current');a(x.classContext.segments[1].value==='수학','context next');a(x.classContext.segments[2].value==='1개 남음','context todo');a(x.classLayout.mode==='school','class layout');a(x.urgentLayout.mode==='focus','urgent layout');a(x.weekendLayout.mode==='rest'&&!x.weekendLayout.timetableVisible,'weekend layout');a(x.setupLayout.mode==='setup'&&!x.setupLayout.timetableVisible,'setup layout');a(x.holiday.tone==='holiday','holiday tone');a(x.holiday.title==='대체공휴일','holiday title');a(x.discretionary.title==='학교장 재량휴업일','discretionary title');a(x.study.primary==='study-active','study primary');a(x.study.title==='영단어','study title');a(x.urgent.primary==='urgent-reminder','urgent primary');a(x.urgent.title==='수학 수행평가','urgent title');a(x.offlineClass.badges.includes('오프라인'),'offline badge');a(y.version==='live-home-stage3-v3','stage3 version');a(y.sequence.includes('adaptive-layout'),'adaptive layout sequence');a(y.modes.includes('focus')&&y.modes.includes('rest'),'adaptive modes')"
              echo "Stage 3 v3 Preview hosted smoke passed: state-aware hierarchy + context rail + timetable + reminders (${PAGE_URL})"
              exit 0
            fi
            sleep 4
          done
          exit 1
