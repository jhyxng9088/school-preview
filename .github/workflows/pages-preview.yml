name: Deploy S-Hub Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-preview-pages
  cancel-in-progress: true

env:
  PREVIEW_LAYER_ID: production-main-mirror-v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      baseline_sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - name: Checkout preview control files
        uses: actions/checkout@v4
        with:
          path: preview-control

      - name: Checkout exact current school main
        id: baseline
        run: |
          set -euo pipefail
          git clone --depth=2 --branch main https://github.com/jhyxng9088/school.git production-source
          sha="$(git -C production-source rev-parse HEAD)"
          echo "MAIN_BASELINE_SHA=$sha" >> "$GITHUB_ENV"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: production-source/package-lock.json

      - name: Test untouched production source
        working-directory: production-source
        run: |
          npm ci
          npm test

      - name: Guard clean production mirror
        run: |
          set -euo pipefail
          test -f preview-control/preview/baseline-isolation.py
          ! grep -ERq 'experience-state-stage1-v1|experience-surface-stage2-v1|live-home-stage3-v3|role-surface-stage4-v1|live-class-hub-stage5-v1' \
            production-source/src production-source/public production-source/index.html production-source/vite.config.js

      - name: Apply Preview runtime isolation only
        run: |
          set -euo pipefail
          python3 preview-control/preview/baseline-isolation.py production-source "$MAIN_BASELINE_SHA"
          grep -Fq "base: '/school-preview/'" production-source/vite.config.js
          grep -Fq "s-hub-preview-layer\" content=\"production-main-mirror-v1" production-source/index.html
          grep -Fq 'school-sync-preview' production-source/src/school-sync.js
          grep -Fq 'preview-class-' production-source/src/school-sync.js
          grep -Fq 'preview|' production-source/src/school-sync.js
          grep -Fq 'school-preview-shell-production-mirror-v1' production-source/public/sw.js
          grep -Fq 'school-preview-notification-profile-production-mirror-v1' production-source/public/sw.js
          grep -Fq "key.startsWith('school-preview-')" production-source/public/sw.js

      - name: Test isolated production mirror
        working-directory: production-source
        run: npm test

      - name: Build Preview
        working-directory: production-source
        run: npm run build

      - name: Verify production-mirror artifact
        working-directory: production-source
        run: |
          set -euo pipefail
          grep -Fq "s-hub-preview-baseline\" content=\"$MAIN_BASELINE_SHA" dist/index.html
          grep -Fq "s-hub-preview-layer\" content=\"production-main-mirror-v1" dist/index.html
          grep -Fq 'school-preview-shell-production-mirror-v1' dist/sw.js
          grep -Fq 'school-preview-notification-profile-production-mirror-v1' dist/sw.js
          grep -Fq "key.startsWith('school-preview-')" dist/sw.js
          ! grep -ERq 'experience-state-stage1-v1|experience-surface-stage2-v1|live-home-stage3-v3|role-surface-stage4-v1|live-class-hub-stage5-v1' dist
          bundle="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' | head -n1)"
          test -n "$bundle"
          grep -Fq 'school-sync-preview' "$bundle"
          grep -Fq 'preview-class-' "$bundle"
          grep -Fq 'preview|' "$bundle"
          grep -Fq 'school.preview.studentProfile.v1' "$bundle"

      - name: Note production main movement during build
        working-directory: production-source
        run: |
          set -euo pipefail
          git fetch origin main
          latest="$(git rev-parse origin/main)"
          if [ "$latest" != "$MAIN_BASELINE_SHA" ]; then
            echo "::warning::Production main advanced during this Preview build: $MAIN_BASELINE_SHA -> $latest"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: production-source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed production mirror
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          BASELINE_SHA: ${{ needs.build.outputs.baseline_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            h="$(curl -fsSL "${PAGE_URL}?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            s="$(curl -fsSL "${PAGE_URL}sw.js?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            if printf '%s' "$h" | grep -Fq "s-hub-preview-baseline\" content=\"${BASELINE_SHA}" \
              && printf '%s' "$h" | grep -Fq 's-hub-preview-layer" content="production-main-mirror-v1' \
              && printf '%s' "$s" | grep -Fq 'school-preview-shell-production-mirror-v1'; then
              echo "GitHub Pages production-mirror smoke test passed: ${PAGE_URL}"
              exit 0
            fi
            sleep 4
          done
          exit 1
