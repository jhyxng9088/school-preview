name: Deploy S-Hub Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-preview-pages
  cancel-in-progress: true

env:
  LEGACY_PREVIEW_COMMIT: 5a78df9622c0567f45a3cfc686babbd9ca7f0207

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current school main
        run: |
          set -euo pipefail
          git clone --depth=2 --branch main https://github.com/jhyxng9088/school.git production-source
          echo "MAIN_BASELINE_SHA=$(git -C production-source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: production-source/package-lock.json

      - name: Install and test untouched current main source
        working-directory: production-source
        run: |
          npm ci
          npm test

      - name: Restore exact previous preview visual layer
        working-directory: production-source
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/jhyxng9088/school/${LEGACY_PREVIEW_COMMIT}/public/preview-dark-ui.css" \
            -o public/preview-dark-ui.css
          grep -Fq 'S-Hub dark UI preview experiment.' public/preview-dark-ui.css
          grep -Fq '.preview-home-signal' public/preview-dark-ui.css
          grep -Fq '.preview-board-card' public/preview-dark-ui.css
          grep -Fq '.academic-list-item' public/preview-dark-ui.css
          grep -Fq '.preview-study-card-heading' public/preview-dark-ui.css
          grep -Fq '.s-hub-ai-page-capability-icon' public/preview-dark-ui.css
          echo "Restored previous preview layer from ${LEGACY_PREVIEW_COMMIT}"

      - name: Isolate preview runtime
        working-directory: production-source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for root in (Path('src'), Path('public')):
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.js', '.jsx', '.mjs'}:
                      text = path.read_text()
                      text = text.replace("'school.", "'school.preview.").replace('"school.', '"school.preview.')
                      text = text.replace("'school-sync'", "'school-sync-preview'").replace('"school-sync"', '"school-sync-preview"')
                      path.write_text(text)

          sync = Path('src/school-sync.js')
          text = sync.read_text()
          identity = "return `${normalized.classNumber}|${normalized.studentNumber}|${compactName}`"
          preview_identity = "return `preview|${normalized.classNumber}|${normalized.studentNumber}|${compactName}`"
          class_key = "return normalized ? `class-${normalized.classNumber}` : ''"
          preview_class_key = "return normalized ? `preview-class-${normalized.classNumber}` : ''"
          if text.count(identity) != 1 or text.count(class_key) != 1:
              raise SystemExit('preview Firebase isolation markers changed')
          sync.write_text(text.replace(identity, preview_identity, 1).replace(class_key, preview_class_key, 1))

          sw = Path('public/sw.js')
          text = sw.read_text()
          cache_line = next((line for line in text.splitlines() if line.startswith("const CACHE_NAME = 'school-shell-")), None)
          tone_line = "const NOTIFICATION_PROFILE_CACHE = 'school-notification-profile-v1'"
          cleanup = ".filter((key) => ![CACHE_NAME, NOTIFICATION_PROFILE_CACHE].includes(key))"
          if not cache_line or tone_line not in text or cleanup not in text:
              raise SystemExit('preview service worker markers changed')
          text = text.replace(cache_line, "const CACHE_NAME = 'school-preview-shell-dark-ui-v10'", 1)
          text = text.replace(tone_line, "const NOTIFICATION_PROFILE_CACHE = 'school-preview-notification-profile-dark-ui-v10'", 1)
          text = text.replace(cleanup, ".filter((key) => key.startsWith('school-preview-') && ![CACHE_NAME, NOTIFICATION_PROFILE_CACHE].includes(key))", 1)
          app_shell = "const APP_SHELL = ["
          if app_shell not in text:
              raise SystemExit('preview app shell marker changed')
          text = text.replace(app_shell, "const APP_SHELL = ['./preview-dark-ui.css', ", 1)
          sw.write_text(text)
          PY

      - name: Patch GitHub Pages base and previous preview cascade
        working-directory: production-source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          vite = Path('vite.config.js')
          text = vite.read_text()
          marker = "base: '/school/',"
          if text.count(marker) != 1:
              raise SystemExit('Vite base marker changed')
          vite.write_text(text.replace(marker, "base: '/school-preview/',", 1))

          index = Path('index.html')
          text = index.read_text()
          if text.count('</head>') != 1:
              raise SystemExit('index head marker changed')
          inject = (
              f'<meta name="s-hub-preview-baseline" content="{os.environ["MAIN_BASELINE_SHA"]}" />'
              '<meta name="s-hub-preview-layer" content="legacy-dark-ui-5a78df9" />'
              '<link rel="stylesheet" href="./preview-dark-ui.css?v=10" />'
          )
          index.write_text(text.replace('</head>', inject + '</head>', 1))
          PY

      - name: Build preview
        working-directory: production-source
        run: npm run build

      - name: Verify isolated previous-preview artifact
        working-directory: production-source
        run: |
          set -euo pipefail
          grep -Fq 's-hub-preview-baseline' dist/index.html
          grep -Fq 'legacy-dark-ui-5a78df9' dist/index.html
          grep -Fq 'preview-dark-ui.css?v=10' dist/index.html
          grep -Fq 'S-Hub dark UI preview experiment.' dist/preview-dark-ui.css
          grep -Fq '.preview-home-signal' dist/preview-dark-ui.css
          grep -Fq '.preview-board-card' dist/preview-dark-ui.css
          grep -Fq 'school-preview-shell-dark-ui-v10' dist/sw.js
          grep -Fq "key.startsWith('school-preview-')" dist/sw.js
          grep -Fq "'./preview-dark-ui.css'" dist/sw.js
          bundle="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' | head -n1)"
          grep -Fq 'school-sync-preview' "$bundle"
          grep -Fq 'preview-class-' "$bundle"
          grep -Fq 'preview|' "$bundle"
          grep -Fq 'school.preview.studentProfile.v1' "$bundle"

      - name: Verify school main did not advance during build
        working-directory: production-source
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${MAIN_BASELINE_SHA}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: production-source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed previous preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            h="$(curl -fsSL "${PAGE_URL}?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            c="$(curl -fsSL "${PAGE_URL}preview-dark-ui.css?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            s="$(curl -fsSL "${PAGE_URL}sw.js?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            if printf '%s' "$h" | grep -Fq 'legacy-dark-ui-5a78df9' \
              && printf '%s' "$h" | grep -Fq 'preview-dark-ui.css?v=10' \
              && printf '%s' "$c" | grep -Fq 'S-Hub dark UI preview experiment.' \
              && printf '%s' "$c" | grep -Fq '.preview-board-card' \
              && printf '%s' "$s" | grep -Fq 'school-preview-shell-dark-ui-v10'; then
              echo "Previous preview layer smoke test passed: ${PAGE_URL}"
              exit 0
            fi
            sleep 4
          done
          exit 1
