name: Deploy S-Hub Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-preview-pages
  cancel-in-progress: true

env:
  PREVIEW_LAYER_ID: experience-state-stage1-v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preview control files
        uses: actions/checkout@v4
        with:
          path: preview-control

      - name: Checkout exact current school main
        run: |
          set -euo pipefail
          git clone --depth=2 --branch main https://github.com/jhyxng9088/school.git production-source
          echo "MAIN_BASELINE_SHA=$(git -C production-source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: production-source/package-lock.json

      - name: Test untouched production source
        working-directory: production-source
        run: |
          npm ci
          npm test

      - name: Guard Stage 1 ownership
        run: |
          set -euo pipefail
          test -f preview-control/preview/stage1-experience-state.js
          test -f preview-control/preview/stage1-experience-state-react.jsx
          test -f preview-control/preview/stage1-experience-state-study-bridge.js
          test -f preview-control/preview/stage1-experience-state-source-patch.js
          test -f preview-control/preview/stage1-experience-state.test.js
          test -f preview-control/preview/stage1-patch.py
          grep -Fq 'experience-state-stage1-v1' preview-control/preview/stage1-experience-state.js
          grep -Fq 'ExperienceStateProvider' preview-control/preview/stage1-experience-state-react.jsx
          grep -Fq 'publishExperienceStudySignal' preview-control/preview/stage1-experience-state-study-bridge.js
          grep -Fq 'patchExperienceStateSource' preview-control/preview/stage1-experience-state-source-patch.js
          ! grep -ERq '\bfetch[[:space:]]*\(' \
            preview-control/preview/stage1-experience-state.js \
            preview-control/preview/stage1-experience-state-react.jsx \
            preview-control/preview/stage1-experience-state-study-bridge.js
          ! grep -ERq 'MutationObserver|createPortal|UnifiedBottomSheet|@keyframes|preview-dark-ui|ia2-home|ia-home-primary' \
            preview-control/preview/stage1-experience-state.js \
            preview-control/preview/stage1-experience-state-react.jsx \
            preview-control/preview/stage1-experience-state-study-bridge.js \
            preview-control/preview/stage1-experience-state-source-patch.js

      - name: Apply Preview-only Stage 1 owner overlay
        run: |
          set -euo pipefail
          python3 preview-control/preview/stage1-patch.py production-source "$MAIN_BASELINE_SHA" overlay
          grep -Fq 'experience-state-stage1-v1' production-source/src/experience-state.js
          grep -Fq 'ExperienceStateProvider' production-source/src/experience-state-react.jsx
          grep -Fq 'publishExperienceStudySignal' production-source/src/experience-state-study-bridge.js
          grep -Fq "import { patchExperienceStateSource } from './src/experience-state-source-patch.js'" production-source/vite.config.js
          grep -Fq 'next = patchExperienceStateSource(next, cleanId)' production-source/vite.config.js
          grep -Fq "base: '/school/'" production-source/vite.config.js
          ! grep -Fq 'experience-state-stage1-v1' production-source/index.html

      - name: Test Stage 1 Experience State model
        working-directory: production-source
        run: |
          set -euo pipefail
          node --test tests/experience-state-stage1.test.js

      - name: Test Stage 1 overlay against production regression suite
        working-directory: production-source
        run: |
          set -euo pipefail
          npm test

      - name: Apply Preview runtime isolation
        run: |
          set -euo pipefail
          python3 preview-control/preview/stage1-patch.py production-source "$MAIN_BASELINE_SHA" isolate
          grep -Fq "base: '/school-preview/'" production-source/vite.config.js
          grep -Fq 'experience-state-stage1-v1' production-source/index.html
          ! grep -Fq 'preview-dark-ui.css' production-source/index.html
          grep -Fq 'school-sync-preview' production-source/src/school-sync.js
          grep -Fq 'preview-class-' production-source/src/school-sync.js
          grep -Fq 'preview|' production-source/src/school-sync.js
          grep -Fq 'school-preview-shell-experience-stage1-v1' production-source/public/sw.js
          grep -Fq 'school-preview-notification-profile-experience-stage1-v1' production-source/public/sw.js
          grep -Fq "key.startsWith('school-preview-')" production-source/public/sw.js

      - name: Test Preview isolation contract
        working-directory: production-source
        run: |
          set -euo pipefail
          node --test push-backend-v2/test/preview-isolation.test.js

      - name: Build Preview
        working-directory: production-source
        run: npm run build

      - name: Verify isolated Stage 1 artifact
        working-directory: production-source
        run: |
          set -euo pipefail
          grep -Fq 's-hub-preview-baseline' dist/index.html
          grep -Fq 'experience-state-stage1-v1' dist/index.html
          ! grep -Fq 'preview-dark-ui.css' dist/index.html
          test ! -e dist/preview-dark-ui.css
          grep -Fq 'school-preview-shell-experience-stage1-v1' dist/sw.js
          grep -Fq 'school-preview-notification-profile-experience-stage1-v1' dist/sw.js
          grep -Fq "key.startsWith('school-preview-')" dist/sw.js
          bundle="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' | head -n1)"
          test -n "$bundle"
          grep -Fq 'experience-state-stage1-v1' "$bundle"
          grep -Fq 'study-active' "$bundle"
          grep -Fq 'urgent-reminder' "$bundle"
          grep -Fq 'school-sync-preview' "$bundle"
          grep -Fq 'preview-class-' "$bundle"
          grep -Fq 'preview|' "$bundle"
          grep -Fq 'school.preview.studentProfile.v1' "$bundle"
          ! grep -Eq 'ia2-home-canvas|ia2-class-hub|ia2-schedule-hub|ia2-ai-workspace' "$bundle"
          node scripts/verify-preview-isolation.mjs dist

      - name: Verify school main did not advance during build
        working-directory: production-source
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${MAIN_BASELINE_SHA}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: production-source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed Stage 1 Preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            h="$(curl -fsSL "${PAGE_URL}?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            s="$(curl -fsSL "${PAGE_URL}sw.js?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            if grep -Fq 'experience-state-stage1-v1' <<< "$h" \
              && ! grep -Fq 'preview-dark-ui.css' <<< "$h" \
              && grep -Fq 'school-preview-shell-experience-stage1-v1' <<< "$s" \
              && grep -Fq "key.startsWith('school-preview-')" <<< "$s"; then
              echo "Stage 1 Preview smoke test passed: ${PAGE_URL}"
              exit 0
            fi
            sleep 4
          done
          exit 1
