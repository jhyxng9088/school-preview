name: Deploy S-Hub Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-preview-pages
  cancel-in-progress: true

env:
  PREVIEW_STYLE_ID: ia-redesign-v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preview control files
        uses: actions/checkout@v4
        with:
          path: preview-control

      - name: Checkout exact current school main
        run: |
          set -euo pipefail
          git clone --depth=2 --branch main https://github.com/jhyxng9088/school.git production-source
          echo "MAIN_BASELINE_SHA=$(git -C production-source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: production-source/package-lock.json

      - name: Test untouched production source
        working-directory: production-source
        run: |
          npm ci
          npm test

      - name: Guard preview layout ownership
        run: |
          set -euo pipefail
          grep -Fq 'S-Hub information architecture preview v1' preview-control/preview/ia-redesign.css
          grep -Fq 'patchIARedesignSource' preview-control/preview/ia-redesign-source-patch.js
          ! grep -Eq 'position:[[:space:]]*(absolute|fixed)' preview-control/preview/ia-redesign.css
          ! grep -Eq 'unified-school-sheet|unified-sheet-backdrop' preview-control/preview/ia-redesign.css
          ! grep -Eq '@keyframes' preview-control/preview/ia-redesign.css
          ! grep -Eq 'createPortal|UnifiedBottomSheet' preview-control/preview/ia-redesign-source-patch.js

      - name: Apply preview-only IA composition
        run: |
          set -euo pipefail
          cp preview-control/preview/ia-redesign.css production-source/public/preview-dark-ui.css
          python3 preview-control/preview/figma-patch.py production-source "$MAIN_BASELINE_SHA"
          grep -Fq 'S-Hub information architecture preview v1' production-source/public/preview-dark-ui.css
          grep -Fq '.ia-home-primary' production-source/public/preview-dark-ui.css
          grep -Fq '.ia-class-hub' production-source/public/preview-dark-ui.css
          grep -Fq '.ia-schedule-hub' production-source/public/preview-dark-ui.css
          grep -Fq '.ia-ai-workspace' production-source/public/preview-dark-ui.css
          grep -Fq 'patchIARedesignSource' production-source/src/ia-preview-patch.js
          grep -Fq "import { patchIARedesignSource } from './src/ia-preview-patch.js'" production-source/vite.config.js
          grep -Fq 'next = patchIARedesignSource(next, cleanId)' production-source/vite.config.js

      - name: Build preview
        working-directory: production-source
        run: npm run build

      - name: Verify isolated IA artifact
        working-directory: production-source
        run: |
          set -euo pipefail
          grep -Fq 's-hub-preview-baseline' dist/index.html
          grep -Fq 'ia-redesign-v1' dist/index.html
          grep -Fq 'preview-dark-ui.css?v=16' dist/index.html
          grep -Fq 'S-Hub information architecture preview v1' dist/preview-dark-ui.css
          grep -Fq '.ia-home-primary' dist/preview-dark-ui.css
          grep -Fq '.ia-class-hub' dist/preview-dark-ui.css
          grep -Fq '.ia-schedule-hub' dist/preview-dark-ui.css
          grep -Fq '.ia-study-page' dist/preview-dark-ui.css
          grep -Fq '.ia-ai-workspace' dist/preview-dark-ui.css
          grep -Fq 'school-preview-shell-ia-redesign-v1' dist/sw.js
          grep -Fq "key.startsWith('school-preview-')" dist/sw.js
          grep -Fq "'./preview-dark-ui.css'" dist/sw.js
          bundle="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' | head -n1)"
          test -n "$bundle"
          grep -Fq 'ia-home-primary' "$bundle"
          grep -Fq 'ia-class-hub' "$bundle"
          grep -Fq 'ia-schedule-hub' "$bundle"
          grep -Fq 'ia-ai-workspace' "$bundle"
          grep -Fq 'ia-study-page' "$bundle"
          grep -Fq '시간표와 게시판을 한 공간에서 이어서 확인해요.' "$bundle"
          grep -Fq '종류보다 시간의 흐름을 먼저 보고' "$bundle"
          grep -Fq 'preview-study-record-sheet' "$bundle"
          grep -Fq 'school-sync-preview' "$bundle"
          grep -Fq 'preview-class-' "$bundle"
          grep -Fq 'preview|' "$bundle"
          grep -Fq 'school.preview.studentProfile.v1' "$bundle"

      - name: Verify school main did not advance during build
        working-directory: production-source
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${MAIN_BASELINE_SHA}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: production-source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed IA preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            h="$(curl -fsSL "${PAGE_URL}?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            c="$(curl -fsSL "${PAGE_URL}preview-dark-ui.css?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            s="$(curl -fsSL "${PAGE_URL}sw.js?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            if grep -Fq 'ia-redesign-v1' <<< "$h" \
              && grep -Fq 'preview-dark-ui.css?v=16' <<< "$h" \
              && grep -Fq 'S-Hub information architecture preview v1' <<< "$c" \
              && grep -Fq '.ia-home-primary' <<< "$c" \
              && grep -Fq '.ia-class-hub' <<< "$c" \
              && grep -Fq 'school-preview-shell-ia-redesign-v1' <<< "$s"; then
              echo "IA preview smoke test passed: ${PAGE_URL}"
              exit 0
            fi
            sleep 4
          done
          exit 1
