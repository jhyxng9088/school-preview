name: Deploy S-Hub Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-preview-pages
  cancel-in-progress: true

env:
  PREVIEW_STYLE_ID: radical-dashboard-v2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preview control files
        uses: actions/checkout@v4
        with:
          path: preview-control

      - name: Checkout exact current school main
        run: |
          set -euo pipefail
          git clone --depth=2 --branch main https://github.com/jhyxng9088/school.git production-source
          echo "MAIN_BASELINE_SHA=$(git -C production-source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: production-source/package-lock.json

      - name: Test untouched production source
        working-directory: production-source
        run: |
          npm ci
          npm test

      - name: Apply preview-only radical composition
        run: |
          set -euo pipefail
          cp preview-control/preview/radical.css production-source/public/preview-dark-ui.css
          python3 preview-control/preview/patch.py production-source "$MAIN_BASELINE_SHA"
          grep -Fq 'S-Hub radical dashboard preview v2' production-source/public/preview-dark-ui.css
          grep -Fq 'patchRadicalPreviewSource' production-source/src/radical-preview-patch.js
          grep -Fq "import { patchRadicalPreviewSource } from './src/radical-preview-patch.js'" production-source/vite.config.js
          grep -Fq 'next = patchRadicalPreviewSource(next, cleanId)' production-source/vite.config.js

      - name: Build preview
        working-directory: production-source
        run: npm run build

      - name: Verify isolated radical artifact
        working-directory: production-source
        run: |
          set -euo pipefail
          grep -Fq 's-hub-preview-baseline' dist/index.html
          grep -Fq 'radical-dashboard-v2' dist/index.html
          grep -Fq 'preview-dark-ui.css?v=12' dist/index.html
          grep -Fq 'S-Hub radical dashboard preview v2' dist/preview-dark-ui.css
          grep -Fq 'preview-dashboard-school' dist/preview-dark-ui.css
          grep -Fq 'school-preview-shell-radical-v2' dist/sw.js
          grep -Fq "key.startsWith('school-preview-')" dist/sw.js
          grep -Fq "'./preview-dark-ui.css'" dist/sw.js
          bundle="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' | head -n1)"
          test -n "$bundle"
          grep -Fq 'preview-dashboard-school' "$bundle"
          grep -Fq 'preview-dashboard-mini' "$bundle"
          grep -Fq 'school-sync-preview' "$bundle"
          grep -Fq 'preview-class-' "$bundle"
          grep -Fq 'preview|' "$bundle"
          grep -Fq 'school.preview.studentProfile.v1' "$bundle"

      - name: Verify school main did not advance during build
        working-directory: production-source
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${MAIN_BASELINE_SHA}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: production-source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed radical preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            h="$(curl -fsSL "${PAGE_URL}?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            c="$(curl -fsSL "${PAGE_URL}preview-dark-ui.css?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            s="$(curl -fsSL "${PAGE_URL}sw.js?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            if printf '%s' "$h" | grep -Fq 'radical-dashboard-v2' \
              && printf '%s' "$h" | grep -Fq 'preview-dark-ui.css?v=12' \
              && printf '%s' "$c" | grep -Fq 'S-Hub radical dashboard preview v2' \
              && printf '%s' "$c" | grep -Fq 'preview-dashboard-school' \
              && printf '%s' "$s" | grep -Fq 'school-preview-shell-radical-v2'; then
              echo "Radical preview smoke test passed: ${PAGE_URL}"
              exit 0
            fi
            sleep 4
          done
          exit 1
