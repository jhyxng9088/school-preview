name: Deploy S-Hub Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-preview-pages
  cancel-in-progress: true

env:
  PREVIEW_STYLE_ID: toss-inspired-v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current school main
        run: |
          set -euo pipefail
          git clone --depth=2 --branch main https://github.com/jhyxng9088/school.git production-source
          echo "MAIN_BASELINE_SHA=$(git -C production-source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: production-source/package-lock.json

      - name: Install and test untouched current main source
        working-directory: production-source
        run: |
          npm ci
          npm test

      - name: Generate Toss-inspired preview visual layer
        working-directory: production-source
        run: |
          cat > public/preview-dark-ui.css <<'CSS'
          /* S-Hub Toss-inspired preview experiment. Preview only. */
          :root {
            --bg: #f2f4f6;
            --surface: #ffffff;
            --surface-soft: #eef1f4;
            --surface-glass: rgba(255, 255, 255, .94);
            --text: #191f28;
            --text-secondary: #4e5968;
            --text-tertiary: #8b95a1;
            --border: rgba(0, 27, 55, .055);
            --divider: #e5e8eb;
            --button-disabled: #d1d6db;
            --shadow-nav: 0 8px 30px rgba(0, 27, 55, .12);
            --background: #f2f4f6;
            --toss-blue: #3182f6;
            --toss-blue-pressed: #1b64da;
            --toss-blue-soft: #e8f3ff;
            --toss-shadow: 0 1px 2px rgba(0, 27, 55, .025), 0 8px 24px rgba(0, 27, 55, .045);
          }

          @media (prefers-color-scheme: dark) {
            :root {
              --bg: #17171c;
              --surface: #202027;
              --surface-soft: #2c2c35;
              --surface-glass: rgba(32, 32, 39, .94);
              --text: #f2f4f6;
              --text-secondary: #b0b8c1;
              --text-tertiary: #7e8793;
              --border: rgba(255, 255, 255, .055);
              --divider: rgba(255, 255, 255, .075);
              --button-disabled: #3a3a43;
              --shadow-nav: 0 10px 34px rgba(0, 0, 0, .34);
              --background: #17171c;
              --toss-blue: #4593fc;
              --toss-blue-pressed: #3182f6;
              --toss-blue-soft: rgba(49, 130, 246, .17);
              --toss-shadow: 0 1px 2px rgba(0, 0, 0, .14), 0 12px 28px rgba(0, 0, 0, .18);
            }
          }

          html, body, #root, .app-shell { background: var(--bg); }
          body { letter-spacing: -.012em; }

          .app-content {
            padding-top: max(28px, env(safe-area-inset-top));
          }

          .home-topbar {
            padding: 6px 2px 24px;
            align-items: center;
          }

          .home-topbar h1,
          .page-header h1,
          .todo-header h1,
          .preview-board-header h1 {
            font-weight: 800;
            letter-spacing: -.055em;
          }

          .home-topbar h1 { font-size: 40px; }
          .home-stack { gap: 20px; }

          .section-heading {
            margin: 0 4px 10px;
            align-items: center;
          }

          .section-heading h2 {
            font-size: 20px;
            font-weight: 780;
          }

          .section-heading > span,
          .section-note,
          .user-name,
          .class-presence-count {
            color: var(--text-tertiary);
          }

          .current-class-card,
          .compact-empty,
          .empty-panel,
          .preview-home-signal,
          .todo-summary,
          .todo-list,
          .todo-empty,
          .todo-home-list,
          .stage3-detail,
          .academic-home-list,
          .academic-focus-card,
          .preview-board-card,
          .preview-study-card,
          .preview-study-live-list,
          .preview-study-today-list,
          .preview-study-loading,
          .preview-study-load-error,
          .preview-study-empty {
            border-color: transparent;
            box-shadow: var(--toss-shadow);
          }

          .current-class-card {
            padding: 23px 23px 0;
            border: 0;
            border-radius: 28px;
            background: linear-gradient(145deg, var(--surface) 0%, color-mix(in srgb, var(--toss-blue-soft) 34%, var(--surface)) 100%);
          }

          .current-class-icon {
            width: 42px;
            height: 42px;
            margin-bottom: 18px;
            border-radius: 15px;
            background: var(--toss-blue-soft);
            color: var(--toss-blue);
          }

          .current-class-label {
            color: var(--toss-blue);
            font-weight: 760;
          }

          .current-class-copy h2 {
            margin-bottom: 8px;
            font-size: 27px;
            font-weight: 800;
          }

          .current-class-copy > p:last-child { color: var(--text-secondary); }
          .next-class-row { min-height: 58px; }

          .preview-home-signals-grid { gap: 12px; }
          .preview-home-signal {
            padding: 18px;
            border: 0;
            border-radius: 22px;
            background: var(--surface);
          }

          .preview-home-signal strong {
            font-size: 20px;
            font-weight: 800;
          }

          .preview-home-signal p {
            margin-top: 7px;
            color: var(--text-tertiary);
            font-size: 11px;
          }

          .preview-home-signal-head span { color: var(--text-secondary); }
          .preview-home-signal.is-active .preview-home-signal-head i { background: var(--toss-blue); }

          .compact-empty,
          .empty-panel {
            border: 0;
            background: var(--surface);
          }

          .period-strip { gap: 7px; }
          .period-item {
            min-height: 61px;
            border: 0;
            border-radius: 17px;
            background: var(--surface);
            box-shadow: 0 1px 2px rgba(0, 27, 55, .025);
          }

          .period-item strong { color: var(--text); }

          .page-header {
            padding: 8px 2px 24px;
            text-align: left;
          }

          .page-header h1 { font-size: 38px; }

          .bottom-nav {
            height: 68px;
            padding: 6px;
            border: 0;
            border-radius: 26px;
            background: var(--surface-glass);
            box-shadow: var(--shadow-nav);
            backdrop-filter: blur(28px) saturate(145%);
            -webkit-backdrop-filter: blur(28px) saturate(145%);
          }

          .nav-indicator {
            border-radius: 20px;
            background: var(--toss-blue-soft);
            box-shadow: none;
          }

          .nav-button {
            min-height: 56px;
            color: var(--text-tertiary);
            font-weight: 680;
          }

          .nav-button.active { color: var(--toss-blue); }
          .nav-button:active { transform: scale(.95); }

          html.school-samsung .bottom-nav {
            background: var(--surface);
            box-shadow: var(--shadow-nav);
          }

          .todo-header { margin-bottom: 22px; }
          .todo-add-button,
          .preview-board-write,
          .preview-study-primary-button,
          .preview-study-pause-button,
          .preview-board-comment-submit,
          .preview-board-empty-action {
            background: var(--toss-blue);
            color: #fff;
            box-shadow: none;
          }

          .todo-add-button:active,
          .preview-board-write:active,
          .preview-study-primary-button:active,
          .preview-board-comment-submit:active {
            background: var(--toss-blue-pressed);
          }

          .todo-summary {
            margin-bottom: 22px;
            padding: 19px 20px;
            border: 0;
            border-radius: 22px;
            background: var(--surface);
          }

          .todo-summary strong { font-size: 18px; font-weight: 780; }
          .todo-list { border: 0; border-radius: 22px; background: var(--surface); }
          .todo-item { min-height: 82px; }
          .todo-check > span { border-color: color-mix(in srgb, var(--text-tertiary) 58%, transparent); }
          .todo-item.is-completed .todo-check > span {
            border-color: var(--toss-blue);
            background: var(--toss-blue);
            box-shadow: inset 0 0 0 5px var(--surface);
          }
          .todo-item-main strong { font-weight: 750; }
          .todo-item.is-completed .todo-item-main { opacity: .66; }
          .todo-home-list { border: 0; background: var(--surface); }

          .stage3-page-header,
          .stage3-page-header .date-label,
          .stage3-page-header h1,
          .stage3-detail-date,
          .stage3-detail h2 {
            text-align: left;
          }

          .stage3-page-header { padding-bottom: 20px; }
          .stage3-week-nav > button {
            border: 0;
            border-radius: 16px;
            background: var(--surface);
            color: var(--text-secondary);
            box-shadow: 0 1px 2px rgba(0, 27, 55, .025);
          }

          .stage3-day-button {
            min-height: 62px;
            border: 0;
            border-radius: 18px;
            background: var(--surface);
            box-shadow: 0 1px 2px rgba(0, 27, 55, .025);
          }

          .stage3-day-button.is-selected {
            border-color: transparent;
            background: var(--toss-blue-soft);
            color: var(--toss-blue);
            box-shadow: none;
          }

          .stage3-day-button.is-selected span { color: var(--toss-blue); opacity: .72; }
          .stage3-detail { border: 0; border-radius: 26px; background: var(--surface); }

          .academic-home-list { border: 0; border-radius: 22px; background: var(--surface); }
          .academic-focus-card {
            border: 0;
            border-radius: 26px;
            background: color-mix(in srgb, var(--toss-blue-soft) 58%, var(--surface));
            text-align: left;
          }

          .academic-list-item {
            min-height: 76px;
            padding: 14px 16px;
          }

          .academic-list-copy h3 { font-weight: 760; }
          .academic-list-copy p { color: var(--text-secondary); line-height: 1.48; }

          .preview-board-header { margin-bottom: 20px; }
          .preview-board-header-note { color: var(--text-secondary); }
          .preview-board-write {
            min-height: 44px;
            padding-inline: 16px;
            border-radius: 15px;
          }

          .preview-board-refresh,
          .preview-board-section-edit,
          .preview-board-load-more,
          .preview-board-owner-edit,
          .preview-board-comment-actions button,
          .preview-board-comment-editor button,
          .preview-board-existing-file button {
            border-color: transparent;
            background: var(--surface-soft);
            color: var(--text-secondary);
          }

          .preview-board-list { gap: 12px; }
          .preview-board-card {
            gap: 11px;
            padding: 19px;
            border: 0;
            border-radius: 22px;
            background: var(--surface);
          }

          .preview-board-card h2 { font-size: 16.5px; font-weight: 780; }
          .preview-board-card-body { color: var(--text-secondary); font-size: 12.5px; }
          .preview-board-card-meta, .preview-board-time, .preview-board-toolbar { color: var(--text-tertiary); }
          .preview-board-badge { background: var(--surface-soft); color: var(--text-secondary); }
          .preview-board-badge.is-question { background: var(--toss-blue-soft); color: var(--toss-blue); }

          .preview-study-stack { gap: 18px; }
          .preview-study-card {
            padding: 22px;
            border: 0;
            border-radius: 26px;
            background: var(--surface);
          }

          .preview-study-card-heading h2 { font-size: 23px; font-weight: 800; }
          .preview-study-card-heading p, .preview-study-live-row, .preview-study-today-summary span, .preview-study-date { color: var(--text-secondary); }
          .preview-study-subjects button {
            min-height: 46px;
            border: 0;
            border-radius: 15px;
            background: var(--surface-soft);
            color: var(--text-secondary);
          }

          .preview-study-subjects button.is-selected {
            background: var(--toss-blue-soft);
            color: var(--toss-blue);
          }

          .preview-study-custom-subject input {
            border-color: transparent;
            background: var(--surface-soft);
          }
          .preview-study-custom-subject input:focus {
            border-color: var(--toss-blue);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--toss-blue) 14%, transparent);
          }
          .preview-study-action-dock.is-active .preview-study-morph-primary {
            border: 0;
            background: var(--surface-soft);
            color: var(--text);
            box-shadow: none;
          }
          .preview-study-action-dock.is-active .preview-study-morph-stop {
            background: var(--toss-blue);
            color: #fff;
          }

          .s-hub-ai-page-capability-icon {
            background: var(--toss-blue-soft);
            color: var(--toss-blue);
          }
          .s-hub-ai-page > .s-hub-ai-content { border-color: transparent; }
          .s-hub-ai-page-title p:last-child,
          .s-hub-ai-page-capability-copy span,
          .s-hub-ai-item-summary > p,
          .s-hub-ai-item-summary-section > p { color: var(--text-secondary); }

          button, .preview-board-card, .preview-home-signal, .period-item {
            -webkit-tap-highlight-color: transparent;
          }

          @media (hover: hover) and (pointer: fine) {
            .preview-board-card:hover,
            .preview-home-signal:hover,
            .current-class-card:hover {
              transform: translateY(-1px);
            }
          }

          @media (max-width: 360px) {
            .home-stack { gap: 17px; }
            .current-class-card { padding: 20px 20px 0; border-radius: 25px; }
            .preview-home-signals-grid { gap: 9px; }
            .preview-home-signal { padding: 15px; border-radius: 20px; }
            .preview-board-card { padding: 17px; }
            .preview-study-card { padding: 19px; }
            .academic-list-item { padding-inline: 13px; }
          }
          CSS
          grep -Fq 'S-Hub Toss-inspired preview experiment' public/preview-dark-ui.css
          grep -Fq '.bottom-nav' public/preview-dark-ui.css
          grep -Fq '.current-class-card' public/preview-dark-ui.css
          grep -Fq '.preview-board-card' public/preview-dark-ui.css
          grep -Fq '.preview-study-card' public/preview-dark-ui.css
          grep -Fq '.todo-list' public/preview-dark-ui.css

      - name: Isolate preview runtime
        working-directory: production-source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for root in (Path('src'), Path('public')):
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.js', '.jsx', '.mjs'}:
                      text = path.read_text()
                      text = text.replace("'school.", "'school.preview.").replace('"school.', '"school.preview.')
                      text = text.replace("'school-sync'", "'school-sync-preview'").replace('"school-sync"', '"school-sync-preview"')
                      path.write_text(text)

          sync = Path('src/school-sync.js')
          text = sync.read_text()
          identity = "return `${normalized.classNumber}|${normalized.studentNumber}|${compactName}`"
          preview_identity = "return `preview|${normalized.classNumber}|${normalized.studentNumber}|${compactName}`"
          class_key = "return normalized ? `class-${normalized.classNumber}` : ''"
          preview_class_key = "return normalized ? `preview-class-${normalized.classNumber}` : ''"
          if text.count(identity) != 1 or text.count(class_key) != 1:
              raise SystemExit('preview Firebase isolation markers changed')
          sync.write_text(text.replace(identity, preview_identity, 1).replace(class_key, preview_class_key, 1))

          sw = Path('public/sw.js')
          text = sw.read_text()
          cache_line = next((line for line in text.splitlines() if line.startswith("const CACHE_NAME = 'school-shell-")), None)
          tone_line = "const NOTIFICATION_PROFILE_CACHE = 'school-notification-profile-v1'"
          cleanup = ".filter((key) => ![CACHE_NAME, NOTIFICATION_PROFILE_CACHE].includes(key))"
          if not cache_line or tone_line not in text or cleanup not in text:
              raise SystemExit('preview service worker markers changed')
          text = text.replace(cache_line, "const CACHE_NAME = 'school-preview-shell-toss-v1'", 1)
          text = text.replace(tone_line, "const NOTIFICATION_PROFILE_CACHE = 'school-preview-notification-profile-toss-v1'", 1)
          text = text.replace(cleanup, ".filter((key) => key.startsWith('school-preview-') && ![CACHE_NAME, NOTIFICATION_PROFILE_CACHE].includes(key))", 1)
          app_shell = "const APP_SHELL = ["
          if app_shell not in text:
              raise SystemExit('preview app shell marker changed')
          text = text.replace(app_shell, "const APP_SHELL = ['./preview-dark-ui.css', ", 1)
          sw.write_text(text)
          PY

      - name: Patch GitHub Pages base and Toss-inspired cascade
        working-directory: production-source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          vite = Path('vite.config.js')
          text = vite.read_text()
          marker = "base: '/school/',"
          if text.count(marker) != 1:
              raise SystemExit('Vite base marker changed')
          vite.write_text(text.replace(marker, "base: '/school-preview/',", 1))

          index = Path('index.html')
          text = index.read_text()
          if text.count('</head>') != 1:
              raise SystemExit('index head marker changed')
          inject = (
              f'<meta name="s-hub-preview-baseline" content="{os.environ["MAIN_BASELINE_SHA"]}" />'
              '<meta name="s-hub-preview-layer" content="toss-inspired-v1" />'
              '<link rel="stylesheet" href="./preview-dark-ui.css?v=11" />'
          )
          index.write_text(text.replace('</head>', inject + '</head>', 1))
          PY

      - name: Build preview
        working-directory: production-source
        run: npm run build

      - name: Verify isolated Toss-inspired artifact
        working-directory: production-source
        run: |
          set -euo pipefail
          grep -Fq 's-hub-preview-baseline' dist/index.html
          grep -Fq 'toss-inspired-v1' dist/index.html
          grep -Fq 'preview-dark-ui.css?v=11' dist/index.html
          grep -Fq 'S-Hub Toss-inspired preview experiment' dist/preview-dark-ui.css
          grep -Fq '.current-class-card' dist/preview-dark-ui.css
          grep -Fq '.preview-board-card' dist/preview-dark-ui.css
          grep -Fq '.preview-study-card' dist/preview-dark-ui.css
          grep -Fq 'school-preview-shell-toss-v1' dist/sw.js
          grep -Fq "key.startsWith('school-preview-')" dist/sw.js
          grep -Fq "'./preview-dark-ui.css'" dist/sw.js
          bundle="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' | head -n1)"
          grep -Fq 'school-sync-preview' "$bundle"
          grep -Fq 'preview-class-' "$bundle"
          grep -Fq 'preview|' "$bundle"
          grep -Fq 'school.preview.studentProfile.v1' "$bundle"

      - name: Verify school main did not advance during build
        working-directory: production-source
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${MAIN_BASELINE_SHA}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: production-source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed Toss-inspired preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            h="$(curl -fsSL "${PAGE_URL}?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            c="$(curl -fsSL "${PAGE_URL}preview-dark-ui.css?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            s="$(curl -fsSL "${PAGE_URL}sw.js?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            if printf '%s' "$h" | grep -Fq 'toss-inspired-v1' \
              && printf '%s' "$h" | grep -Fq 'preview-dark-ui.css?v=11' \
              && printf '%s' "$c" | grep -Fq 'S-Hub Toss-inspired preview experiment' \
              && printf '%s' "$c" | grep -Fq -- '--toss-blue: #3182f6' \
              && printf '%s' "$s" | grep -Fq 'school-preview-shell-toss-v1'; then
              echo "Toss-inspired preview smoke test passed: ${PAGE_URL}"
              exit 0
            fi
            sleep 4
          done
          exit 1
