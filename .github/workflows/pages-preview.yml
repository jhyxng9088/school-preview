name: Deploy S-Hub Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-preview-pages
  cancel-in-progress: true

env:
  PREVIEW_STYLE_ID: ia-redesign-v2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout preview control files
        uses: actions/checkout@v4
        with:
          path: preview-control

      - name: Checkout exact current school main
        run: |
          set -euo pipefail
          git clone --depth=2 --branch main https://github.com/jhyxng9088/school.git production-source
          echo "MAIN_BASELINE_SHA=$(git -C production-source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: production-source/package-lock.json

      - name: Test untouched production source
        working-directory: production-source
        run: |
          npm ci
          npm test

      - name: Guard preview layout ownership
        run: |
          set -euo pipefail
          grep -Fq 'S-Hub information architecture preview v2' preview-control/preview/ia-redesign.css
          grep -Fq 'S-Hub IA layout ownership supplement v1' preview-control/preview/ia-layout-owner.css
          grep -Fq '.ia2-schedule-hub' preview-control/preview/ia-redesign.css
          grep -Fq 'patchIARedesignSource' preview-control/preview/ia-redesign-source-patch.js
          ! grep -Eq 'position:[[:space:]]*(absolute|fixed)' preview-control/preview/ia-redesign.css preview-control/preview/ia-layout-owner.css
          ! grep -Eq 'unified-school-sheet|unified-sheet-backdrop' preview-control/preview/ia-redesign.css preview-control/preview/ia-layout-owner.css
          ! grep -Eq '@keyframes' preview-control/preview/ia-redesign.css preview-control/preview/ia-layout-owner.css
          ! grep -Eq 'createPortal|UnifiedBottomSheet' preview-control/preview/ia-redesign-source-patch.js

      - name: Apply preview-only IA composition
        run: |
          set -euo pipefail
          check_marker() {
            local marker="$1"
            local file="$2"
            local label="$3"
            if ! grep -Fq "$marker" "$file"; then
              echo "::error::IA preview check failed: ${label}"
              echo "Expected marker: ${marker}"
              echo "File: ${file}"
              exit 1
            fi
            echo "IA check passed: ${label}"
          }

          cat preview-control/preview/ia-redesign.css \
              preview-control/preview/ia-layout-owner.css \
              > production-source/public/preview-dark-ui.css
          python3 preview-control/preview/figma-patch.py production-source "$MAIN_BASELINE_SHA"

          check_marker 'S-Hub information architecture preview v2' production-source/public/preview-dark-ui.css 'preview CSS copied'
          check_marker '.ia2-home-now' production-source/public/preview-dark-ui.css 'home hero CSS present'
          check_marker '.ia2-class-hub' production-source/public/preview-dark-ui.css 'class hub CSS present'
          check_marker '.ia2-schedule-hub' production-source/public/preview-dark-ui.css 'schedule hub CSS present'
          check_marker '.ia2-ai-workspace' production-source/public/preview-dark-ui.css 'AI workspace CSS present'
          check_marker 'patchIARedesignSource' production-source/src/ia-preview-patch.js 'IA source patch copied'
          check_marker "import { patchIARedesignSource } from './src/ia-preview-patch.js'" production-source/vite.config.js 'IA Vite import wired'
          check_marker 'next = patchIARedesignSource(next, cleanId)' production-source/vite.config.js 'IA final transform wired'

      - name: Build preview
        working-directory: production-source
        run: npm run build

      - name: Verify isolated IA artifact
        working-directory: production-source
        run: |
          set -euo pipefail
          grep -Fq 's-hub-preview-baseline' dist/index.html
          grep -Fq 'ia-redesign-v2' dist/index.html
          grep -Fq 'preview-dark-ui.css?v=17' dist/index.html
          grep -Fq 'S-Hub information architecture preview v2' dist/preview-dark-ui.css
          grep -Fq '.ia2-home-now' dist/preview-dark-ui.css
          grep -Fq '.ia2-home-stream' dist/preview-dark-ui.css
          grep -Fq '.ia2-class-hub' dist/preview-dark-ui.css
          grep -Fq '.ia2-schedule-hub' dist/preview-dark-ui.css
          grep -Fq '.ia2-study-page' dist/preview-dark-ui.css
          grep -Fq '.ia2-ai-workspace' dist/preview-dark-ui.css
          grep -Fq 'school-preview-shell-ia-redesign-v2' dist/sw.js
          grep -Fq "key.startsWith('school-preview-')" dist/sw.js
          grep -Fq "'./preview-dark-ui.css'" dist/sw.js
          bundle="$(find dist/assets -maxdepth 1 -type f -name 'index-*.js' | head -n1)"
          test -n "$bundle"
          grep -Fq 'ia2-home-canvas' "$bundle"
          grep -Fq 'ia2-home-now' "$bundle"
          grep -Fq 'ia2-class-hub' "$bundle"
          grep -Fq 'ia2-schedule-hub' "$bundle"
          grep -Fq 'ia2-ai-workspace' "$bundle"
          grep -Fq 'ia2-study-page' "$bundle"
          grep -Fq '한 반의 흐름으로 이어집니다.' "$bundle"
          grep -Fq '이번 주의 필요한 정보를 한 자리에서 넘겨 봐요.' "$bundle"
          grep -Fq 'preview-study-record-sheet' "$bundle"
          grep -Fq 'school-sync-preview' "$bundle"
          grep -Fq 'preview-class-' "$bundle"
          grep -Fq 'preview|' "$bundle"
          grep -Fq 'school.preview.studentProfile.v1' "$bundle"

      - name: Verify school main did not advance during build
        working-directory: production-source
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${MAIN_BASELINE_SHA}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: production-source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed IA preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            h="$(curl -fsSL "${PAGE_URL}?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            c="$(curl -fsSL "${PAGE_URL}preview-dark-ui.css?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            s="$(curl -fsSL "${PAGE_URL}sw.js?run=${GITHUB_RUN_ID}&n=${attempt}" || true)"
            if grep -Fq 'ia-redesign-v2' <<< "$h" \
              && grep -Fq 'preview-dark-ui.css?v=17' <<< "$h" \
              && grep -Fq 'S-Hub information architecture preview v2' <<< "$c" \
              && grep -Fq '.ia2-home-now' <<< "$c" \
              && grep -Fq '.ia2-class-hub' <<< "$c" \
              && grep -Fq '.ia2-schedule-hub' <<< "$c" \
              && grep -Fq 'school-preview-shell-ia-redesign-v2' <<< "$s"; then
              echo "IA v2 preview smoke test passed: ${PAGE_URL}"
              exit 0
            fi
            sleep 4
          done
          exit 1
